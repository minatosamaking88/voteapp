services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-featurevote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-featurevote}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - featurevote-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-featurevote} -d ${POSTGRES_DB:-featurevote}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  featurevote-postgres:
